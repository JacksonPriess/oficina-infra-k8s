name: CI/CD - Infra Kubernetes

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yaml"

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: oficina-state-priess951
  TF_WORKING_DIR: ./terraform

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "latest"

      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check

      # O backend S3 precisa existir antes do terraform init.
      # Em PR apenas verificamos/criamos o bucket para permitir o init/plan.
      - name: Garantir bucket do Terraform State
        run: |
          if ! aws s3api head-bucket \
            --bucket "${{ env.TF_STATE_BUCKET }}" 2>/dev/null; then

            echo "Bucket não encontrado. Criando..."

            aws s3api create-bucket \
              --bucket "${{ env.TF_STATE_BUCKET }}" \
              --region "${{ env.AWS_REGION }}"

            aws s3api put-bucket-versioning \
              --bucket "${{ env.TF_STATE_BUCKET }}" \
              --versioning-configuration Status=Enabled

            echo "Bucket criado e versionamento habilitado."

          else
            echo "Bucket já existe."
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Configurar acesso ao EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name oficina-api-dev-cluster

      - name: Instalar Metrics Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      - name: Validar Metrics Server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl rollout status deployment/metrics-server \
            -n kube-system \
            --timeout=180s

          kubectl get deployment metrics-server -n kube-system        