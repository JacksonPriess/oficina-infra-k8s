name: Deploy RabbitMQ

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "messaging/rabbitmq/**"
      - "scripts/deploy-rabbitmq.sh"
      - ".github/workflows/rabbitmq.yml"
  push:
    branches: [main]
    paths:
      - "messaging/rabbitmq/**"
      - "scripts/deploy-rabbitmq.sh"
      - ".github/workflows/rabbitmq.yml"
  workflow_run:
    workflows: ["CI/CD - Infra Kubernetes"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: rabbitmq-oficina-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: oficina-api-dev-cluster
  K8S_NAMESPACE: default

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Validar sintaxe shell e YAML
        run: |
          bash -n scripts/deploy-rabbitmq.sh
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path("messaging/rabbitmq").glob("*.yaml"):
              list(yaml.safe_load_all(path.read_text()))
              print(f"YAML valido: {path}")
          PY

  deploy:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Configurar kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
      - name: Implantar RabbitMQ persistente
        env:
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_ERLANG_COOKIE: ${{ secrets.RABBITMQ_ERLANG_COOKIE }}
        run: bash scripts/deploy-rabbitmq.sh
