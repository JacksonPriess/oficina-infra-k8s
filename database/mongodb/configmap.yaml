apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-servico-init
data:
  01-criar-usuario.js: |
    db.getSiblingDB("oficina_servicos_db").createUser({
      user: "catalogo_servico_app",
      pwd: process.env.MONGODB_APP_PASSWORD,
      roles: [{ role: "readWrite", db: "oficina_servicos_db" }]
    });
